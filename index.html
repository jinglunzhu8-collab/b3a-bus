<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A 富泰邨 → 深圳灣口岸 · 實時巴士到站</title>
<style>
  :root{
    --bg:#0d1117;
    --card:#161b22;
    --card2:#1c2330;
    --line:#2a3140;
    --txt:#e6edf3;
    --dim:#8b949e;
    --brand:#2f81f7;
    --brand2:#1f6feb;
    --ok:#3fb950;
    --warn:#d29922;
    --err:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#17233a 0%,var(--bg) 55%);
    color:var(--txt);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .wrap{width:100%;max-width:520px}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .badge{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;font-weight:800;font-size:22px;letter-spacing:1px;
    padding:10px 16px;border-radius:14px;
    box-shadow:0 6px 20px rgba(47,129,247,.35);
  }
  .head h1{font-size:18px;font-weight:700;line-height:1.3}
  .head .sub{font-size:12.5px;color:var(--dim);font-weight:400;margin-top:3px}
  .route{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;margin-bottom:14px;
    font-size:15px;font-weight:600;
  }
  .route .arrow{color:var(--brand);font-size:18px}
  .route .from,.route .to{flex:1}
  .route .to{text-align:right}
  .hero{
    background:linear-gradient(160deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:20px;
    padding:22px 20px 18px;text-align:center;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(600px 160px at 50% 0%,rgba(47,129,247,.18),transparent 70%);
    pointer-events:none;
  }
  .hero .label{font-size:13px;color:var(--dim);letter-spacing:2px;margin-bottom:6px}
  .hero .big{
    font-size:76px;line-height:1;font-weight:800;
    background:linear-gradient(180deg,#79b8ff,#2f81f7);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .hero .unit{font-size:22px;font-weight:700;color:var(--dim);margin-left:6px}
  .hero .etaTime{margin-top:10px;font-size:14px;color:var(--dim)}
  .hero .etaTime b{color:var(--txt);font-weight:600}
  .hero .arriving{
    display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;
    background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.45);
    color:var(--ok);font-size:14px;font-weight:700;
  }
  .list{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;margin-bottom:14px;
  }
  .list h2{
    font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:1.5px;
    padding:12px 16px 8px;
  }
  .row{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 16px;border-top:1px solid var(--line);
  }
  .row .n{
    width:26px;height:26px;border-radius:50%;
    background:#21262d;border:1px solid var(--line);
    color:var(--dim);font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .row .t{flex:1;margin-left:12px;font-size:14.5px;color:#c9d1d9}
  .row .t span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .row .m{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:#79b8ff}
  .row .m small{font-size:12px;font-weight:600;color:var(--dim);margin-left:3px}
  .row.first .m{color:#ffa657}
  .row.first .n{background:rgba(255,166,87,.15);border-color:rgba(255,166,87,.4);color:#ffa657}
  .state{
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--dim);
    padding:0 4px 6px;flex-wrap:wrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2s infinite}
  .dot.err{background:var(--err);animation:none}
  .dot.loading{background:var(--warn);animation:none}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}
    70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}
    100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
  }
  .bar{flex:1;min-width:110px;height:5px;background:#21262d;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width 1s linear}
  .src{font-size:11.5px;color:#6e7681;text-align:center;line-height:1.6}
  .src a{color:var(--brand);text-decoration:none}
  .empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:14px}
  .empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}
  .foot{text-align:center;margin-top:14px;font-size:12px;color:#6e7681}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="badge">B3A</div>
    <div>
      <h1>城巴 B3A 實時到站時間</h1>
      <div class="sub">數據來源：DATA.GOV.HK 城巴開源數據（實時）</div>
    </div>
  </div>

  <div class="route">
    <div class="from">富泰邨</div>
    <div class="arrow">➜</div>
    <div class="to">深圳灣口岸</div>
  </div>

  <div class="hero" id="hero">
    <div class="label">下一班</div>
    <div><span class="big" id="big">--</span><span class="unit">分鐘</span></div>
    <div class="etaTime" id="etaTime">正在獲取數據…</div>
    <div id="arrivingWrap"></div>
  </div>

  <div class="list">
    <h2>其後班次</h2>
    <div id="rows"><div class="empty"><b>載入中…</b>正在連接城巴實時到站 API</div></div>
  </div>

  <div class="state">
    <span class="dot loading" id="dot"></span>
    <span id="status">連接中…</span>
    <span class="bar"><i id="bar"></i></span>
    <span id="countdown">30 秒</span>
  </div>

  <div class="foot" id="foot">上次更新：—</div>

  <div class="src">
    資料來源：<a href="https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/003261/B3A" target="_blank" rel="noopener">城巴 ETA 開放數據 API</a>（DATA.GOV.HK）·
    每 30 秒自動刷新
  </div>
</div>

<script>
(function(){
  // 城巴開源數據 (DATA.GOV.HK) — CTB = 城巴, 003261 = 富泰邨（青山公路）, B3A 往 深圳灣口岸
  var API = "https://rt.data.gov.hk/v1/transport/citybus-nwfb/eta/CTB/003261/B3A";
  var REFRESH_MS = 30000;      // 每 30 秒刷新
  var nextFetch = Date.now() + REFRESH_MS;
  var lastOK = null;
  var etas = [];               // 本輪取得的到站時間（毫秒時間戳）
  var busy = false;            // 是否正在請求

  var big = document.getElementById('big');
  var etaTime = document.getElementById('etaTime');
  var arrivingWrap = document.getElementById('arrivingWrap');
  var rows = document.getElementById('rows');
  var statusEl = document.getElementById('status');
  var dot = document.getElementById('dot');
  var bar = document.getElementById('bar');
  var countdown = document.getElementById('countdown');
  var foot = document.getElementById('foot');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function hhmm(ts){
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function minutesUntil(ts){
    return Math.round((ts - Date.now()) / 60000);
  }

  function setState(kind, text){
    dot.className = 'dot' + (kind === 'ok' ? '' : ' ' + kind);
    statusEl.textContent = text;
  }

  function render(){
    // 過濾已離站的班次
    var now = Date.now();
    var live = etas.filter(function(t){ return t > now - 30000; });

    if(!live.length){
      big.textContent = '--';
      etaTime.textContent = lastOK ? '暫時沒有即將到達的班次' : '未能取得到站數據';
      arrivingWrap.innerHTML = '';
      rows.innerHTML = '<div class="empty"><b>' +
        (lastOK ? '目前沒有即將到達的班次' : '暫時未能連接開放數據') + '</b>' +
        (lastOK ? '請稍後自動刷新（每 30 秒）' : '系統會每 30 秒自動重試') + '</div>';
      return;
    }

    // 主顯示：下一班
    var next = live[0];
    var m = minutesUntil(next);
    if(m < 1){
      big.innerHTML = '0';
      arrivingWrap.innerHTML = '<span class="arriving">巴士即將到達</span>';
      etaTime.innerHTML = '預計 <b>' + hhmm(next) + '</b> 到站';
    }else{
      big.textContent = m;
      arrivingWrap.innerHTML = '';
      etaTime.innerHTML = '預計 <b>' + hhmm(next) + '</b> 到站';
    }

    // 其後班次
    var html = '';
    live.slice(0, 5).forEach(function(t, i){
      var mm = minutesUntil(t);
      var val = mm < 1 ? '0' : mm;
      html += '<div class="row' + (i === 0 ? ' first' : '') + '">' +
                '<div class="n">' + (i + 1) + '</div>' +
                '<div class="t">' + (i === 0 ? '下一班' : '第 ' + (i + 1) + ' 班') +
                  '<span>' + hhmm(t) + ' 預計到站 · 往 深圳灣口岸</span></div>' +
                '<div class="m">' + val + '<small>分鐘</small></div>' +
              '</div>';
    });
    rows.innerHTML = html;
  }

  function tick(){
    // 倒數 + 進度條
    var remain = Math.max(0, nextFetch - Date.now());
    countdown.textContent = Math.ceil(remain / 1000) + ' 秒';
    bar.style.width = (remain / REFRESH_MS * 100) + '%';
    if(remain <= 0 && !busy){ loadData(); }
    render();
  }

  function loadData(){
    if(busy) return;
    busy = true;
    if(!lastOK) setState('loading', '連接開放數據中…');

    getEtas().then(function(list){
      etas = list;
      lastOK = Date.now();
      nextFetch = Date.now() + REFRESH_MS;
      setState('ok', '實時數據 · 每 30 秒自動刷新');
      foot.textContent = '上次更新：' + hhmm(lastOK) + ':' + pad(new Date(lastOK).getSeconds()) +
        '（香港時間）· 共 ' + list.length + ' 班';
      render();
    }).catch(function(e){
      nextFetch = Date.now() + REFRESH_MS;
      setState('err', '連接失敗，稍後自動重試');
      foot.textContent = '資料讀取失敗：' + (e && e.message ? e.message : '網絡錯誤');
      render();
    }).then(function(){
      busy = false;
    });
  }

  function getEtas(){
    return window.fetch(API + '?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(j){
        var data = (j && j.data) || [];
        return data
          .filter(function(x){ return x.eta; })
          .map(function(x){ return new Date(x.eta).getTime(); })
          .filter(function(t){ return !isNaN(t); })
          .sort(function(a, b){ return a - b; });
      });
  }

  // 首次載入
  loadData();
  setInterval(tick, 1000);
  tick();
  // 每 30 秒自動刷新
  setInterval(function(){ if(!busy) loadData(); }, REFRESH_MS);
  // 分頁重新可見時立即刷新
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && !busy) loadData();
  });
})();
</script>
</body>
</html>
